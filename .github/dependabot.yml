# Family dependency updates target the production line through checked pull requests.
version: 2
updates:
  # The root lockfile covers the client, server and shared workspaces.
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # plugin-sdk is standalone with a lockfile of its own and ships to npm.
  - package-ecosystem: npm
    directory: /plugin-sdk
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(plugin-sdk)
      prefix-development: chore(plugin-sdk)
    groups:
      plugin-sdk-minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins of third-party actions current, comment included.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The Dockerfile's base images. The Node major follows .nvmrc and the
  # engines ranges, so it moves by hand, together with them.
  - package-ecosystem: docker
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
